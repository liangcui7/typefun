    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23203a43'/%3E%3Cstop offset='100%25' stop-color='%232c5364'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='96' fill='url(%23bg)'/%3E%3Ccircle cx='200' cy='220' r='90' fill='none' stroke='%234fc3f7' stroke-width='24'/%3E%3Ctext x='200' y='245' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='96' fill='%234fc3f7'%3E%24%3C/text%3E%3Ccircle cx='312' cy='292' r='90' fill='none' stroke='%2381d4fa' stroke-width='24'/%3E%3Ctext x='312' y='318' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='80' fill='%2381d4fa'%3E%C2%A5%3C/text%3E%3C/svg%3E">
    <title>Currency Converter</title>
    <script>
        const manifest = {
            name: "Currency Converter",
            short_name: "Currency",
            start_url: "converter.html",
            display: "standalone",
            background_color: "#050a0e",
            theme_color: "#050a0e",
            icons: [{
                src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23203a43'/%3E%3Cstop offset='100%25' stop-color='%232c5364'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='96' fill='url(%23bg)'/%3E%3Ccircle cx='200' cy='220' r='90' fill='none' stroke='%234fc3f7' stroke-width='24'/%3E%3Ctext x='200' y='245' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='96' fill='%234fc3f7'%3E%24%3C/text%3E%3Ccircle cx='312' cy='292' r='90' fill='none' stroke='%2381d4fa' stroke-width='24'/%3E%3Ctext x='312' y='318' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='80' fill='%2381d4fa'%3E%C2%A5%3C/text%3E%3C/svg%3E",

            }]
        };
        const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = URL.createObjectURL(blob);
        document.head.appendChild(link);
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Share+Tech+Mono&display=swap');

        :root {
            --cyan: #00e5ff;
            --cyan-dim: rgba(0, 229, 255, 0.15);
            --cyan-glow: rgba(0, 229, 255, 0.4);
            --orange: #ff6d00;
            --orange-dim: rgba(255, 109, 0, 0.15);
            --orange-glow: rgba(255, 109, 0, 0.4);
            --bg-deep: #050a0e;
            --bg-panel: rgba(8, 18, 25, 0.85);
            --border: rgba(0, 229, 255, 0.12);
            --text: #c8d6e5;
            --text-dim: #4a6070;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background: var(--bg-deep);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            color: var(--text);
            padding-bottom: 300px;
            overflow-x: hidden;
        }

        /* === ANIMATED BACKGROUND === */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% 0%, rgba(0, 229, 255, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 20% 100%, rgba(255, 109, 0, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(0, 229, 255, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Touch ripple overlay */
        .touch-ripple {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, var(--cyan) 0%, transparent 70%);
            pointer-events: none;
            transform: scale(0);
            opacity: 0.5;
            z-index: 10;
        }

        .touch-ripple.fire {
            animation: ripple-expand 0.6s cubic-bezier(0, 0.5, 0.3, 1) forwards;
        }

        .touch-ripple.orange {
            background: radial-gradient(circle, var(--orange) 0%, transparent 70%);
        }

        @keyframes ripple-expand {
            to { transform: scale(1); opacity: 0; }
        }

        /* === FLOATING PARTICLES === */
        .particles {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 1px;
            height: 1px;
            background: var(--cyan);
            border-radius: 50%;
            opacity: 0;
            animation: float-up linear infinite;
        }

        @keyframes float-up {
            0% { transform: translateY(100vh) scale(1); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(0); opacity: 0; }
        }

        /* === CONTAINER === */
        .container {
            position: relative;
            z-index: 1;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            margin: 20px;
            animation: container-in 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes container-in {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Corner accents - Death Stranding style */
        .container::before,
        .container::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: var(--cyan);
            border-style: solid;
            opacity: 0.5;
        }
        .container::before {
            top: -1px; left: -1px;
            border-width: 1px 0 0 1px;
        }
        .container::after {
            bottom: -1px; right: -1px;
            border-width: 0 1px 1px 0;
        }

        /* Pulsing top border glow */
        .container-glow {
            position: absolute;
            top: 0; left: 10%; right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--cyan), transparent);
            animation: glow-pulse 3s ease-in-out infinite;
        }

        @keyframes glow-pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        h1 {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 4px;
            color: #fff;
            text-shadow: 0 0 20px var(--cyan-glow);
            animation: title-in 1s ease forwards;
            opacity: 0;
        }

        @keyframes title-in {
            0% { opacity: 0; letter-spacing: 0.8em; }
            100% { opacity: 1; letter-spacing: 0.3em; }
        }

        .subtitle {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-bottom: 16px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            animation: fade-in 1.2s ease forwards;
            opacity: 0;
        }

        @keyframes fade-in {
            to { opacity: 1; }
        }

        /* === CURRENCY ROWS === */
        .currency-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
            padding: 6px 8px;
            border-radius: 2px;
            position: relative;
            transition: background 0.3s;
            animation: row-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateX(-20px);
        }

        .currency-row:nth-child(1) { animation-delay: 0.1s; }
        .currency-row:nth-child(2) { animation-delay: 0.15s; }
        .currency-row:nth-child(3) { animation-delay: 0.2s; }
        .currency-row:nth-child(4) { animation-delay: 0.25s; }
        .currency-row:nth-child(5) { animation-delay: 0.3s; }
        .currency-row:nth-child(6) { animation-delay: 0.35s; }

        @keyframes row-in {
            to { opacity: 1; transform: translateX(0); }
        }

        .currency-row::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, transparent, var(--cyan), transparent);
            transform: scaleY(0);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 12px var(--cyan), 0 0 24px var(--cyan-glow);
        }

        .currency-row:has(.currency-input:focus)::before {
            transform: scaleY(1);
        }

        .currency-row:has(.currency-input:focus) {
            background: rgba(0, 229, 255, 0.04);
            border-radius: 4px;
        }

        .currency-row:has(.currency-input:focus) .code {
            color: #fff;
            text-shadow: 0 0 10px var(--cyan-glow);
        }

        .currency-row:has(.currency-input:focus) .currency-name {
            color: var(--cyan);
            opacity: 0.7;
        }

        .currency-row:has(.currency-input:focus) .flag {
            filter: drop-shadow(0 0 6px var(--cyan-glow));
        }

        /* Sweep highlight on row select */
        .currency-row::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, var(--cyan-glow), transparent 40%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }

        .currency-row.sweep::after {
            animation: row-sweep 0.5s ease-out forwards;
        }

        @keyframes row-sweep {
            0% { opacity: 0.3; transform: translateX(-100%); }
            100% { opacity: 0; transform: translateX(100%); }
        }

        /* Value flash on update */
        .currency-input.value-flash {
            animation: val-flash 0.35s ease-out;
        }

        @keyframes val-flash {
            0% { color: var(--cyan); text-shadow: 0 0 12px var(--cyan-glow); }
            100% { color: #fff; text-shadow: none; }
        }

        /* Active input glow pulse */
        .currency-input.active-glow {
            animation: input-breathe 2s ease-in-out infinite;
        }

        @keyframes input-breathe {
            0%, 100% { box-shadow: 0 0 12px rgba(0,229,255,0.12), 0 0 25px rgba(0,229,255,0.05), inset 0 0 15px rgba(0,229,255,0.03); }
            50% { box-shadow: 0 0 20px rgba(0,229,255,0.25), 0 0 40px rgba(0,229,255,0.1), inset 0 0 25px rgba(0,229,255,0.06); }
        }

        .currency-label {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 90px;
            cursor: pointer;
            position: relative;
        }

        .currency-label .default-star {
            position: absolute;
            top: -6px;
            right: -2px;
            font-size: 0.5rem;
            color: var(--orange);
            display: none;
            filter: drop-shadow(0 0 4px var(--orange-glow));
        }

        .currency-label.is-default .default-star {
            display: block;
            animation: star-pulse 2s ease-in-out infinite;
        }

        @keyframes star-pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .flag {
            font-size: 1.2rem;
            line-height: 1;
        }

        .code {
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            font-size: 0.75rem;
            color: var(--cyan);
            letter-spacing: 0.1em;
        }

        .currency-name {
            font-size: 0.6rem;
            color: var(--text-dim);
            letter-spacing: 0.05em;
        }

        /* === INPUTS === */
        .currency-input {
            flex: 1;
            background: rgba(0, 229, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 10px 12px;
            font-size: 1rem;
            color: #fff;
            outline: none;
            transition: all 0.3s;
            text-align: right;
            font-family: 'Share Tech Mono', monospace;
        }

        .currency-input:focus {
            border-color: var(--cyan);
            box-shadow:
                0 0 15px rgba(0, 229, 255, 0.2),
                0 0 30px rgba(0, 229, 255, 0.08),
                inset 0 0 20px rgba(0, 229, 255, 0.05);
            background: rgba(0, 229, 255, 0.07);
            color: var(--cyan);
        }

        .currency-input::placeholder {
            color: rgba(0, 229, 255, 0.15);
        }

        /* === STATUS === */
        .status {
            text-align: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            animation: fade-in 1.5s ease forwards;
            opacity: 0;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }

        .status-dot.live {
            background: var(--cyan);
            box-shadow: 0 0 8px var(--cyan), 0 0 16px var(--cyan-glow);
            animation: dot-pulse 2s ease-in-out infinite;
        }

        @keyframes dot-pulse {
            0%, 100% { box-shadow: 0 0 4px var(--cyan), 0 0 8px var(--cyan-glow); }
            50% { box-shadow: 0 0 8px var(--cyan), 0 0 20px var(--cyan-glow); }
        }

        .status-dot.static {
            background: var(--orange);
            box-shadow: 0 0 8px var(--orange-glow);
        }

        .status-text {
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .refresh-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 4px 12px;
            border-radius: 2px;
            font-size: 0.65rem;
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            margin-left: 10px;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            box-shadow: 0 0 10px var(--cyan-glow);
        }

        /* === NUMPAD === */
        .numpad {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding: 10px 12px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            background: linear-gradient(180deg, rgba(5, 10, 14, 0.95), rgba(8, 15, 22, 0.98));
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            max-width: 480px;
            margin: 0 auto;
            z-index: 50;
            animation: numpad-in 0.6s 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(100%);
        }

        /* Numpad top glow line */
        .numpad::before {
            content: '';
            position: absolute;
            top: 0; left: 20%; right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--cyan), transparent);
            opacity: 0.4;
        }

        @keyframes numpad-in {
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .numpad { max-width: 100%; }
        }

        .numpad-btn {
            background: rgba(0, 229, 255, 0.04);
            border: 1px solid rgba(0, 229, 255, 0.08);
            border-radius: 2px;
            color: #fff;
            font-size: 1.2rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 400;
            padding: 16px 0;
            cursor: pointer;
            transition: all 0.12s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow: hidden;
        }

        .numpad-btn.btn-pop {
            animation: btn-pop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes btn-pop {
            0% { transform: scale(1); }
            30% { transform: scale(0.88); background: rgba(0, 229, 255, 0.2); border-color: var(--cyan); box-shadow: 0 0 20px var(--cyan-glow); }
            60% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        .numpad-btn.btn-pop-orange {
            animation: btn-pop-orange 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes btn-pop-orange {
            0% { transform: scale(1); }
            30% { transform: scale(0.88); background: rgba(255, 109, 0, 0.25); border-color: var(--orange); box-shadow: 0 0 20px var(--orange-glow); }
            60% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        /* Shockwave ring on press */
        .numpad-shockwave {
            position: absolute;
            border-radius: 50%;
            border: 1px solid var(--cyan);
            pointer-events: none;
            transform: scale(0);
            opacity: 0.6;
        }

        .numpad-shockwave.fire {
            animation: shockwave 0.5s ease-out forwards;
        }

        .numpad-shockwave.orange {
            border-color: var(--orange);
        }

        @keyframes shockwave {
            to { transform: scale(3); opacity: 0; }
        }

        .numpad-btn.clear-btn {
            color: var(--orange);
            border-color: rgba(255, 109, 0, 0.15);
            font-size: 0.8rem;
            letter-spacing: 0.15em;
        }

        .numpad-btn.backspace-btn {
            color: var(--orange);
        }

        /* === DECORATIVE ELEMENTS === */
        .hud-corner {
            position: fixed;
            width: 40px;
            height: 40px;
            border-color: rgba(0, 229, 255, 0.15);
            border-style: solid;
            pointer-events: none;
            z-index: 0;
        }
        .hud-corner.tl { top: 12px; left: 12px; border-width: 1px 0 0 1px; }
        .hud-corner.tr { top: 12px; right: 12px; border-width: 1px 1px 0 0; }
        .hud-corner.bl { bottom: 270px; left: 12px; border-width: 0 0 1px 1px; }
        .hud-corner.br { bottom: 270px; right: 12px; border-width: 0 1px 1px 0; }

        /* Data readout line */
        .data-line {
            position: fixed;
            top: 8px;
            right: 60px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.55rem;
            color: rgba(0, 229, 255, 0.2);
            letter-spacing: 0.1em;
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- HUD corners -->
    <div class="hud-corner tl"></div>
    <div class="hud-corner tr"></div>
    <div class="hud-corner bl"></div>
    <div class="hud-corner br"></div>
    <div class="data-line" id="dataLine">SYS:ACTIVE</div>

    <!-- Floating particles -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="container-glow"></div>
        <h1>Currency</h1>
        <p class="subtitle">Realtime Exchange Network</p>

        <div class="currency-row">
            <div class="currency-label" data-currency-label>
                <span class="default-star">&#9733;</span>
                <span class="flag">&#127481;&#127484;</span>
                <div>
                    <div class="code">TWD</div>
                    <div class="currency-name">NT Dollar</div>
                </div>
            </div>
            <input type="text" inputmode="none" readonly class="currency-input" id="TWD" placeholder="0.00">
        </div>

        <div class="currency-row">
            <div class="currency-label" data-currency-label>
                <span class="default-star">&#9733;</span>
                <span class="flag">&#127482;&#127480;</span>
                <div>
                    <div class="code">USD</div>
                    <div class="currency-name">US Dollar</div>
                </div>
            </div>
            <input type="text" inputmode="none" readonly class="currency-input" id="USD" placeholder="0.00">
        </div>

        <div class="currency-row">
            <div class="currency-label" data-currency-label>
                <span class="default-star">&#9733;</span>
                <span class="flag">&#127464;&#127462;</span>
                <div>
                    <div class="code">CAD</div>
                    <div class="currency-name">Canadian Dollar</div>
                </div>
            </div>
            <input type="text" inputmode="none" readonly class="currency-input" id="CAD" placeholder="0.00">
        </div>

        <div class="currency-row">
            <div class="currency-label" data-currency-label>
                <span class="default-star">&#9733;</span>
                <span class="flag">&#127464;&#127475;</span>
                <div>
                    <div class="code">CNY</div>
                    <div class="currency-name">Chinese Yuan</div>
                </div>
            </div>
            <input type="text" inputmode="none" readonly class="currency-input" id="CNY" placeholder="0.00">
        </div>

        <div class="currency-row">
            <div class="currency-label" data-currency-label>
                <span class="default-star">&#9733;</span>
                <span class="flag">&#127471;&#127477;</span>
                <div>
                    <div class="code">JPY</div>
                    <div class="currency-name">Japanese Yen</div>
                </div>
            </div>
            <input type="text" inputmode="none" readonly class="currency-input" id="JPY" placeholder="0.00">
        </div>

        <div class="currency-row">
            <div class="currency-label" data-currency-label>
                <span class="default-star">&#9733;</span>
                <span class="flag">&#127480;&#127468;</span>
                <div>
                    <div class="code">SGD</div>
                    <div class="currency-name">Singapore Dollar</div>
                </div>
            </div>
            <input type="text" inputmode="none" readonly class="currency-input" id="SGD" placeholder="0.00">
        </div>

        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-text" id="statusText">Connecting...</span>
            <button class="refresh-btn" onclick="fetchRates()">Sync</button>
        </div>

    </div>

    <div class="numpad">
        <button class="numpad-btn" data-key="1">1</button>
        <button class="numpad-btn" data-key="2">2</button>
        <button class="numpad-btn" data-key="3">3</button>
        <button class="numpad-btn" data-key="4">4</button>
        <button class="numpad-btn" data-key="5">5</button>
        <button class="numpad-btn" data-key="6">6</button>
        <button class="numpad-btn" data-key="7">7</button>
        <button class="numpad-btn" data-key="8">8</button>
        <button class="numpad-btn" data-key="9">9</button>
        <button class="numpad-btn" data-key=".">.</button>
        <button class="numpad-btn" data-key="0">0</button>
        <button class="numpad-btn backspace-btn" data-key="del">&#9003;</button>
        <button class="numpad-btn clear-btn" data-key="C" style="grid-column: 1 / -1;">CLEAR</button>
    </div>

    <script>
        // === PARTICLES ===
        (function() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (8 + Math.random() * 12) + 's';
                p.style.animationDelay = (Math.random() * 10) + 's';
                p.style.width = p.style.height = (1 + Math.random() * 1.5) + 'px';
                if (Math.random() > 0.7) p.style.background = '#ff6d00';
                container.appendChild(p);
            }
        })();

        // === DATA LINE READOUT ===
        (function() {
            const el = document.getElementById('dataLine');
            setInterval(() => {
                const now = new Date();
                const ts = now.toTimeString().slice(0, 8);
                el.textContent = `SYS:ACTIVE // ${ts}`;
            }, 1000);
        })();

        // === INTERACTION EFFECTS ===
        function createRipple(container, x, y, size, isOrange) {
            const ripple = document.createElement('div');
            ripple.className = 'touch-ripple' + (isOrange ? ' orange' : '');
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (x - size / 2) + 'px';
            ripple.style.top = (y - size / 2) + 'px';
            container.appendChild(ripple);
            requestAnimationFrame(() => ripple.classList.add('fire'));
            setTimeout(() => ripple.remove(), 600);
        }

        function createShockwave(container, x, y, isOrange) {
            const ring = document.createElement('div');
            ring.className = 'numpad-shockwave' + (isOrange ? ' orange' : '');
            ring.style.width = ring.style.height = '40px';
            ring.style.left = (x - 20) + 'px';
            ring.style.top = (y - 20) + 'px';
            container.appendChild(ring);
            requestAnimationFrame(() => ring.classList.add('fire'));
            setTimeout(() => ring.remove(), 500);
        }

        function flashValue(input) {
            input.classList.remove('value-flash');
            void input.offsetWidth;
            input.classList.add('value-flash');
        }

        function sweepRow(row) {
            row.classList.remove('sweep');
            void row.offsetWidth;
            row.classList.add('sweep');
        }

        // === CORE LOGIC ===
        const currencies = ['TWD', 'USD', 'CAD', 'CNY', 'JPY', 'SGD'];
        const DEFAULT_CURRENCY_KEY = 'defaultCurrency';

        const staticRates = {
            TWD: 32.5,
            USD: 1,
            CAD: 1.36,
            CNY: 7.25,
            JPY: 149.5,
            SGD: 1.34
        };

        let rates = { ...staticRates };
        let isLive = false;
        let activeField = null;

        function getDefaultCurrency() {
            return localStorage.getItem(DEFAULT_CURRENCY_KEY) || 'TWD';
        }

        function setDefaultCurrency(code) {
            localStorage.setItem(DEFAULT_CURRENCY_KEY, code);
            document.querySelectorAll('.currency-label').forEach(el => {
                el.classList.remove('is-default');
            });
            const row = document.getElementById(code).closest('.currency-row');
            row.querySelector('.currency-label').classList.add('is-default');
        }

        async function fetchRates() {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            try {
                const res = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await res.json();

                if (data.result === 'success') {
                    rates.USD = 1;
                    rates.TWD = data.rates.TWD;
                    rates.CAD = data.rates.CAD;
                    rates.CNY = data.rates.CNY;
                    rates.JPY = data.rates.JPY;
                    rates.SGD = data.rates.SGD;
                    isLive = true;

                    statusDot.className = 'status-dot live';
                    const updated = new Date(data.time_last_update_utc).toLocaleDateString();
                    statusText.textContent = `LIVE // ${updated}`;

                    if (activeField) {
                        convert(activeField);
                    }
                } else {
                    throw new Error('API returned error');
                }
            } catch {
                rates = { ...staticRates };
                isLive = false;
                statusDot.className = 'status-dot static';
                statusText.textContent = 'OFFLINE // STATIC RATES';
            }
        }

        function addCommas(numStr) {
            const parts = numStr.split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            return parts.join('.');
        }

        function formatInput(input) {
            const raw = input.value.replace(/,/g, '');
            if (raw === '' || raw === '.' || raw === '-') return;
            const match = raw.match(/^(\d*)(\.\d*)?$/);
            if (!match) return;
            const formatted = addCommas(match[1] || '0') + (match[2] || '');
            const cursorFromEnd = input.value.length - input.selectionStart;
            input.value = formatted;
            const newCursor = Math.max(0, formatted.length - cursorFromEnd);
            input.setSelectionRange(newCursor, newCursor);
        }

        function convert(sourceCurrency) {
            const sourceInput = document.getElementById(sourceCurrency);
            const rawValue = sourceInput.value.replace(/,/g, '');
            const value = parseFloat(rawValue);

            if (isNaN(value) || rawValue.trim() === '') {
                currencies.forEach(c => {
                    if (c !== sourceCurrency) {
                        document.getElementById(c).value = '';
                    }
                });
                return;
            }

            formatInput(sourceInput);

            const valueInUSD = value / rates[sourceCurrency];

            currencies.forEach((c, i) => {
                if (c !== sourceCurrency) {
                    const el = document.getElementById(c);
                    const converted = valueInUSD * rates[c];
                    const decimals = (c === 'JPY' || c === 'TWD') ? 0 : 2;
                    const newVal = addCommas(converted.toFixed(decimals));
                    if (el.value !== newVal) {
                        el.value = newVal;
                        setTimeout(() => flashValue(el), i * 40);
                    }
                }
            });
        }

        // Set up input listeners and tap-to-set-default
        currencies.forEach(currency => {
            const input = document.getElementById(currency);
            const label = input.closest('.currency-row').querySelector('.currency-label');

            input.addEventListener('input', () => {
                activeField = currency;
                convert(currency);
            });

            input.addEventListener('focus', () => {
                activeField = currency;
                // Remove breathing glow from all, add to focused
                document.querySelectorAll('.currency-input').forEach(el => el.classList.remove('active-glow'));
                input.classList.add('active-glow');
                // Sweep effect on row
                sweepRow(input.closest('.currency-row'));
            });

            label.addEventListener('click', () => {
                setDefaultCurrency(currency);
            });
        });

        // Mark default and select it on load
        const defaultCurrency = getDefaultCurrency();
        setDefaultCurrency(defaultCurrency);
        activeField = defaultCurrency;
        document.getElementById(defaultCurrency).focus();

        // Numpad logic with interaction effects
        document.querySelectorAll('.numpad-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                if (!activeField) activeField = getDefaultCurrency();
                const input = document.getElementById(activeField);
                const raw = input.value.replace(/,/g, '');
                const key = btn.dataset.key;
                const isOrange = key === 'C' || key === 'del';

                // Button bounce animation
                btn.classList.remove('btn-pop', 'btn-pop-orange');
                void btn.offsetWidth;
                btn.classList.add(isOrange ? 'btn-pop-orange' : 'btn-pop');

                // Ripple from touch point
                const rect = btn.getBoundingClientRect();
                const x = e.clientX ? e.clientX - rect.left : rect.width / 2;
                const y = e.clientY ? e.clientY - rect.top : rect.height / 2;
                createRipple(btn, x, y, 120, isOrange);
                createShockwave(btn, x, y, isOrange);

                if (key === 'C') {
                    input.value = '';
                    convert(activeField);
                } else if (key === 'del') {
                    input.value = addCommas(raw.slice(0, -1));
                    convert(activeField);
                } else if (key === '.') {
                    if (!raw.includes('.')) {
                        input.value = addCommas(raw || '0') + '.';
                        convert(activeField);
                    }
                } else {
                    input.value = addCommas(raw + key);
                    convert(activeField);
                }

                // Flash the active input
                flashValue(input);
            });
        });

        fetchRates();
    </script>
</body>
</html>
