    <title>Currency Converter</title>
    <script>
        const manifest = {
            name: "Currency Converter",
            short_name: "Currency",
            start_url: "converter.html",
            display: "standalone",
            background_color: "#050a0e",
            theme_color: "#050a0e",
            icons: [{
                src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%230f172a'/%3E%3Cstop offset='100%25' stop-color='%231e3a5f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='96' fill='url(%23bg)'/%3E%3Ccircle cx='200' cy='220' r='90' fill='none' stroke='%232563eb' stroke-width='24'/%3E%3Ctext x='200' y='245' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='96' fill='%232563eb'%3E%24%3C/text%3E%3Ccircle cx='312' cy='292' r='90' fill='none' stroke='%2360a5fa' stroke-width='24'/%3E%3Ctext x='312' y='318' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='80' fill='%2360a5fa'%3E%C2%A5%3C/text%3E%3C/svg%3E",

        const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = URL.createObjectURL(blob);
        document.head.appendChild(link);
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Share+Tech+Mono&family=Product+Sans:wght@400;500;700&family=Google+Sans:wght@400;500;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --cyan: #2563eb;
            --cyan-dim: rgba(37, 99, 235, 0.15);
            --cyan-glow: rgba(37, 99, 235, 0.4);
            --orange: #ff6d00;
            --orange-dim: rgba(255, 109, 0, 0.15);
            --orange-glow: rgba(255, 109, 0, 0.4);
            --bg-deep: #050a0e;
            --bg-panel: rgba(8, 18, 25, 0.85);
            --border: rgba(37, 99, 235, 0.12);
            --text: #c8d6e5;
            --text-dim: #4a6070;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
            width: 100%;
        }

        body {
            font-family: 'Google Sans', 'Product Sans', 'Inter', sans-serif;
            background: var(--bg-deep);
            min-height: 100dvh;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            color: var(--text);
            overflow-x: hidden;
            overscroll-behavior: none;
        }

        /* === ANIMATED BACKGROUND === */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% 0%, rgba(37, 99, 235, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 20% 100%, rgba(255, 109, 0, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(37, 99, 235, 0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Touch ripple overlay */
        .touch-ripple {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, var(--cyan) 0%, transparent 70%);
            pointer-events: none;
            transform: scale(0);
            opacity: 0.5;
            z-index: 10;
        }

        .touch-ripple.fire {
            animation: ripple-expand 0.6s cubic-bezier(0, 0.5, 0.3, 1) forwards;
        }

        .touch-ripple.orange {
            background: radial-gradient(circle, var(--orange) 0%, transparent 70%);
        }

        @keyframes ripple-expand {
            to { transform: scale(1); opacity: 0; }
        }

        /* === FLOATING PARTICLES === */
        .particles {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 1px;
            height: 1px;
            background: var(--cyan);
            border-radius: 50%;
            opacity: 0;
            animation: float-up linear infinite;
        }

        @keyframes float-up {
            0% { transform: translateY(100vh) scale(1); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(0); opacity: 0; }
        }

        /* === CONTAINER === */
        .container {
            position: relative;
            z-index: 1;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 20px 16px;
            width: 100%;
            max-width: 480px;
            margin: 12px;
            animation: container-in 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes container-in {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Corner accents - Death Stranding style */
        .container::before,
        .container::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: var(--cyan);
            border-style: solid;
            opacity: 0.5;
        }
        .container::before {
            top: -1px; left: -1px;
            border-width: 1px 0 0 1px;
        }
        .container::after {
            bottom: -1px; right: -1px;
            border-width: 0 1px 1px 0;
            border-color: var(--cyan);
        }

        /* Pulsing top border glow */
        .container-glow {
            position: absolute;
            top: 0; left: 10%; right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--cyan), #fff, var(--cyan), transparent);
            animation: glow-pulse 3s ease-in-out infinite;
        }

        @keyframes glow-pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        h1 {
            text-align: center;
            font-family: 'Google Sans', 'Product Sans', 'Inter', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            margin-bottom: 4px;
            color: #fff;
            text-shadow: 0 0 12px var(--cyan-glow);
            min-height: 1.6em;
        }

        h1 .title-cursor {
            display: none;
        }

        .subtitle {
            text-align: center;
            font-size: 0.7rem;
            color: var(--cyan);
            opacity: 0.5;
            margin-bottom: 16px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            animation: fade-in 1.2s ease forwards;
            opacity: 0;
        }

        @keyframes fade-in {
            to { opacity: 1; }
        }

        /* === CURRENCY ROWS === */
        .currency-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
            padding: 6px 8px;
            border-radius: 2px;
            position: relative;
            transition: background 0.3s;
            animation: row-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateX(-20px);
        }

        .currency-row:nth-child(1) { animation-delay: 0.1s; }
        .currency-row:nth-child(2) { animation-delay: 0.15s; }
        .currency-row:nth-child(3) { animation-delay: 0.2s; }
        .currency-row:nth-child(4) { animation-delay: 0.25s; }
        .currency-row:nth-child(5) { animation-delay: 0.3s; }
        .currency-row:nth-child(6) { animation-delay: 0.35s; }
        .currency-row:nth-child(7) { animation-delay: 0.4s; }

        @keyframes row-in {
            to { opacity: 1; transform: translateX(0); }
        }

        .currency-row::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, transparent, var(--cyan), #fff, var(--cyan), transparent);
            transform: scaleY(0);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 12px var(--cyan), 0 0 24px var(--cyan-glow);
        }

        .currency-row.active-row::before {
            transform: scaleY(1);
        }

        .currency-row.active-row {
            background: rgba(37, 99, 235, 0.04);
            border-radius: 4px;
        }

        .currency-row.active-row .code {
            color: #fff;
            text-shadow: 0 0 10px var(--cyan-glow);
        }

        .currency-row.active-row .currency-name {
            color: var(--cyan);
            opacity: 0.7;
        }

        .currency-row.active-row .flag {
            filter: drop-shadow(0 0 6px var(--cyan-glow));
        }

        /* Sweep highlight on row select */
        .currency-row::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.4), var(--cyan-glow), transparent 40%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }

        .currency-row.sweep::after {
            animation: row-sweep 0.5s ease-out forwards;
        }

        @keyframes row-sweep {
            0% { opacity: 0.3; transform: translateX(-100%); }
            100% { opacity: 0; transform: translateX(100%); }
        }

        /* Value flash on update */
        .currency-input.value-flash {
            animation: val-flash 0.35s ease-out;
        }

        @keyframes val-flash {
            0% { color: var(--cyan); text-shadow: 0 0 12px var(--cyan-glow); }
            100% { color: #fff; text-shadow: none; }
        }

        /* Active input glow pulse */
        .currency-input.active-glow {
            animation: input-breathe 2s ease-in-out infinite;
        }

        @keyframes input-breathe {
            0%, 100% { box-shadow: 0 0 12px rgba(37,99,235,0.12), 0 0 25px rgba(37,99,235,0.05), inset 0 0 15px rgba(37,99,235,0.03); }
            50% { box-shadow: 0 0 20px rgba(37,99,235,0.25), 0 0 40px rgba(37,99,235,0.1), inset 0 0 25px rgba(37,99,235,0.06); }
        }

        /* Flicker effect on focus */
        @keyframes focus-flicker {
            0% { opacity: 1; }
            5% { opacity: 0.2; }
            10% { opacity: 0.9; }
            15% { opacity: 0.3; }
            20% { opacity: 1; }
            30% { opacity: 0.85; }
            35% { opacity: 1; }
            100% { opacity: 1; }
        }

        .currency-row.focus-flicker .currency-input {
            animation: focus-flicker 0.4s ease-out;
        }

        .currency-row.focus-flicker::before {
            transform: scaleY(1);
            animation: bar-flicker 0.5s ease-out;
        }

        @keyframes bar-flicker {
            0% { opacity: 0; }
            8% { opacity: 1; }
            16% { opacity: 0.2; }
            24% { opacity: 0.9; }
            32% { opacity: 0.3; }
            40% { opacity: 1; }
            55% { opacity: 0.7; }
            60% { opacity: 1; }
            100% { opacity: 1; }
        }

        /* Default currency set flicker */
        .currency-label.default-flicker .default-star {
            animation: star-flicker 0.6s ease-out;
        }

        @keyframes star-flicker {
            0% { opacity: 1; filter: brightness(1); }
            8% { opacity: 0.1; filter: brightness(3); }
            16% { opacity: 1; filter: brightness(1.5); }
            24% { opacity: 0.3; filter: brightness(2); }
            32% { opacity: 0.9; filter: brightness(1); }
            44% { opacity: 0.4; filter: brightness(2.5); }
            52% { opacity: 1; filter: brightness(1.2); }
            70% { opacity: 0.85; filter: brightness(1); }
            100% { opacity: 1; filter: brightness(1); }
        }

        /* Quick pulse on keypress */
        .currency-input.key-pulse {
            animation: key-pulse 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes key-pulse {
            0% { transform: scale(1.02); box-shadow: 0 0 25px rgba(255,255,255,0.3), 0 0 50px rgba(37,99,235,0.5), inset 0 0 20px rgba(37,99,235,0.15); border-color: rgba(255,255,255,0.9); background: rgba(37, 99, 235, 0.9); }
            30% { background: rgba(37, 99, 235, 0.15); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(37,99,235,0.2), 0 0 30px rgba(37,99,235,0.08), inset 0 0 20px rgba(37,99,235,0.05); border-color: #fff; background: rgba(37,99,235,0.07); }
        }

        /* Wave ring expanding from input on keypress */
        .input-wave {
            position: absolute;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 3px;
            opacity: 0;
            z-index: 5;
        }

        .input-wave.fire {
            animation: input-wave-expand 0.6s cubic-bezier(0, 0.5, 0.3, 1) forwards;
        }

        @keyframes input-wave-expand {
            0% { opacity: 0.5; transform: scale(1); border-color: rgba(255, 255, 255, 0.5); box-shadow: 0 0 8px rgba(37, 99, 235, 0.4); }
            40% { opacity: 0.3; border-color: rgba(37, 99, 235, 0.3); }
            100% { opacity: 0; transform: scale(1.15, 1.8); border-color: rgba(37, 99, 235, 0.1); box-shadow: none; }
        }

        .currency-label {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 110px;
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
        }

        .currency-label .default-star {
            display: none;
            font-size: 0.35rem;
            font-family: 'Google Sans', 'Product Sans', 'Inter', sans-serif;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #ffd600;
            padding: 1px 4px;
            border-radius: 2px;
            position: relative;
            z-index: 1;
        }

        .currency-label .default-star::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 3px;
            padding: 1px;
            background: linear-gradient(90deg, #ffd600, #ffab00, #ff6d00, #ffab00, #ffd600);
            background-size: 200% 100%;
            animation: border-shimmer 2s linear infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            z-index: -1;
        }

        @keyframes border-shimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .currency-label.is-default .default-star {
            display: inline-block;
        }

        .flag {
            font-size: 1.2rem;
            line-height: 1;
        }

        .code {
            font-family: 'Google Sans', 'Product Sans', 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.75rem;
            color: var(--cyan);
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .currency-name {
            font-size: 0.6rem;
            color: rgba(160, 180, 210, 0.8);
            letter-spacing: 0.05em;
        }

        /* === INPUTS === */
        .currency-input {
            flex: 1;
            background: rgba(37, 99, 235, 0.03);
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 10px 12px;
            font-size: 1rem;
            color: #fff;
            outline: none;
            transition: all 0.3s;
            text-align: right;
            font-family: 'Google Sans', 'Product Sans', 'Inter', sans-serif;
        }

        /* Beating cursor for focused input */
        .cursor-blink {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            width: 2px;
            height: 1.1em;
            background: var(--cyan);
            border-radius: 1px;
            pointer-events: none;
            opacity: 0;
            box-shadow: 0 0 6px var(--cyan), 0 0 12px var(--cyan-glow);
            animation: cursor-beat 0.33s ease-in-out infinite;
        }

        @keyframes cursor-beat {
            0%, 100% { opacity: 0; }
            30%, 70% { opacity: 1; }
        }

        .currency-input:focus {
            border-color: #fff;
            box-shadow:
                0 0 15px rgba(37, 99, 235, 0.2),
                0 0 30px rgba(37, 99, 235, 0.08),
                inset 0 0 20px rgba(37, 99, 235, 0.05);
            background: rgba(37, 99, 235, 0.07);
            color: #fff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.4), 0 0 20px rgba(37, 99, 235, 0.3);
        }

        .currency-input::placeholder {
            color: rgba(37, 99, 235, 0.15);
        }

        /* === STATUS === */
        .status {
            text-align: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(37, 99, 235, 0.1);
            animation: fade-in 1.5s ease forwards;
            opacity: 0;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }

        .status-dot.live {
            background: var(--cyan);
            box-shadow: 0 0 8px var(--cyan), 0 0 16px var(--cyan-glow);
            animation: dot-pulse 2s ease-in-out infinite;
        }

        @keyframes dot-pulse {
            0%, 100% { box-shadow: 0 0 4px var(--cyan), 0 0 8px var(--cyan-glow); }
            50% { box-shadow: 0 0 8px var(--cyan), 0 0 20px var(--cyan-glow); }
        }

        .status-dot.static {
            background: var(--orange);
            box-shadow: 0 0 8px var(--orange-glow);
        }

        .status-text {
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .refresh-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 4px 12px;
            border-radius: 2px;
            font-size: 0.65rem;
            font-family: 'Google Sans', 'Product Sans', 'Inter', sans-serif;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            margin-left: 10px;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            box-shadow: 0 0 10px var(--cyan-glow);
        }

        /* === NUMPAD === */
        .numpad {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            max-width: 100vw;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            padding: 6px 10px;
            padding-bottom: max(6px, env(safe-area-inset-bottom));
            background: linear-gradient(180deg, rgba(5, 10, 14, 0.95), rgba(8, 15, 22, 0.98));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            z-index: 50;
            overflow: hidden;
        }

        /* Numpad top glow line */
        .numpad::before {
            content: '';
            position: absolute;
            top: 0; left: 20%; right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--cyan), #fff, var(--cyan), transparent);
            opacity: 0.4;
        }

        @media (max-width: 480px) {
            .container {
                margin: 8px;
                padding: 16px 12px;
            }
        }

        .numpad-btn {
            background: rgba(37, 99, 235, 0.04);
            border: 1px solid rgba(37, 99, 235, 0.08);
            border-radius: 2px;
            color: #fff;
            font-size: 1.25rem;
            font-family: 'Google Sans', 'Product Sans', 'Inter', sans-serif;
            font-weight: 500;
            padding: 13px 0;
            min-width: 0;
            cursor: pointer;
            transition: all 0.12s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow: hidden;
        }

        .numpad-btn.btn-pop {

        @keyframes login-dissolve {

        /* Scanline effect */
        .login-overlay::before {
            content: '';

            );

        /* Sweeping scan line */
        .login-overlay::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyan), #fff, var(--cyan), transparent);

            0%, 100% { top: -2px; }

        .login-bg-glow {
            position: absolute;

        .login-bg-glow:nth-child(1) {
            top: -100px; left: -100px;

        .login-bg-glow:nth-child(2) {
            bottom: -150px; right: -100px;
            width: 500px; height: 500px;

        .login-input {

        .login-input:focus ~ .login-input-line {
            width: 100%;

        .login-btn {
            width: 100%;
            padding: 14px;
            background: rgba(37, 99, 235, 0.06);
            border: 1px solid rgba(37, 99, 235, 0.25);

        .login-btn:hover {

        .login-btn:active {

        }

        /* Button sweep effect */
        .login-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(37, 99, 235, 0.15), transparent);

        }

        .login-btn:hover::after {

        }

        .login-error {
            text-align: center;
            font-size: 0.65rem;
            color: #ff4444;
            letter-spacing: 0.05em;

        .login-error.visible {

        @keyframes login-error-shake {

        /* Success state */
        .login-input.login-success {
            border-color: #00e676;

        .login-welcome {
            text-align: center;
            font-size: 0.65rem;
            color: #00e676;
            letter-spacing: 0.1em;

        .login-welcome.visible {

        /* Hex grid background decoration */
        .login-hex-grid {
            position: absolute;

                radial-gradient(circle at 1px 1px, rgba(37, 99, 235, 0.04) 1px, transparent 0);
            background-size: 40px 40px;
            pointer-events: none;
            animation: login-grid-fade 2s ease forwards;

        }

        @keyframes login-grid-fade {
            to { opacity: 1; }
        }

        /* Login particles */
        .login-particles {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .login-particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--cyan);
            border-radius: 50%;
            opacity: 0;
            animation: login-particle-float linear infinite;

        @keyframes login-particle-float {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }

            50% { transform: translateY(50vh) translateX(20px); }
            95% { opacity: 0.5; }
            100% { transform: translateY(-10vh) translateX(-10px); opacity: 0; }
        }

        /* Hidden state for main content during login */
        body.locked .container,
        body.locked .numpad,
        body.locked .hud-corner,
        body.locked .data-line,
        body.locked .particles {
            display: none;
        }

    </style>
</head>

    <script>
        // === LOGIN / AUTHENTICATION ===
        (function() {
            const AUTH_KEY = 'currencyConverterAuth';
            const ALLOWED_HASHES = [
                '5de1bc0fc427161d264aca46e3e2978932a0235124b79db4ced52f7b71241777',
                'a435f27a3fc54a8db4b3184cb4ef4edef3dee19307eb521ca7171df347fb33c2',
                '3606e12a94e358f0e8afd0623b7742280e0d9fe3b0d2e1b984e6182eb49cba04',
                '3aac28c6a5be9fc5216da777b319f4579acc2c6c1c5c2a93c0d0269d605983d1',
                'c3ee50788723922287c2ae33eeb3e391d06208c1c696817019425a5c03d5d893'
            ];

            async function hashName(name) {
                const data = new TextEncoder().encode(name);
                const buf = await crypto.subtle.digest('SHA-256', data);
                return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
            }

            // Check if already authenticated
            function setSubtitleName(name) {
                const sub = document.getElementById('subtitleText');
                if (sub && name) sub.textContent = 'Premium & ad-free for ' + name;
            }

            if (localStorage.getItem(AUTH_KEY)) {
                setSubtitleName(localStorage.getItem(AUTH_KEY));
                document.body.classList.remove('locked');
                const overlay = document.getElementById('loginOverlay');
                if (overlay) overlay.remove();
            } else {
                // Generate login particles
                const particleContainer = document.getElementById('loginParticles');
                for (let i = 0; i < 30; i++) {
                    const p = document.createElement('div');
                    p.className = 'login-particle';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.animationDuration = (6 + Math.random() * 10) + 's';
                    p.style.animationDelay = (Math.random() * 8) + 's';
                    p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
                    if (Math.random() > 0.75) p.style.background = '#ff6d00';
                    particleContainer.appendChild(p);
                }

                const input = document.getElementById('loginInput');
                const btn = document.getElementById('loginBtn');
                const errorEl = document.getElementById('loginError');
                const welcomeEl = document.getElementById('loginWelcome');
                const overlay = document.getElementById('loginOverlay');

                async function attemptLogin() {
                    const name = input.value.trim();
                    if (!name) {
                        showError('Please enter your <strong>real name</strong>');
                        return;
                    }

                    const nameHash = await hashName(name.toLowerCase());
                    if (ALLOWED_HASHES.includes(nameHash)) {
                        // Success
                        input.classList.add('login-success');
                        errorEl.textContent = '';
                        errorEl.classList.remove('visible');
                        btn.style.borderColor = '#00e676';
                        btn.style.color = '#00e676';
                        btn.textContent = 'Access Granted';
                        btn.disabled = true;

                        // Show welcome message
                        const displayName = name.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
                        welcomeEl.textContent = 'Welcome, ' + displayName;
                        welcomeEl.classList.add('visible');

                        // Save auth
                        localStorage.setItem(AUTH_KEY, displayName);
                        setSubtitleName(displayName);

                        // Unlock after a beat
                        setTimeout(() => {
                            overlay.classList.add('unlocked');
                            document.body.classList.remove('locked');

                            setTimeout(() => {
                                overlay.remove();
                            }, 1200);
                        }, 1000);
                    } else {
                        showError('Not recognized — please use your <strong>real name</strong>');
                        input.classList.add('login-error-glow');
                        setTimeout(() => input.classList.remove('login-error-glow'), 300);
                    }
                }

                function showError(msg) {
                    errorEl.innerHTML = msg;
                    errorEl.classList.remove('visible');
                    void errorEl.offsetWidth;
                    errorEl.classList.add('visible');
                }

                btn.addEventListener('click', attemptLogin);
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') attemptLogin();
                });

                // Scroll login card into view when mobile keyboard opens
                input.addEventListener('focus', () => {
                    setTimeout(() => {
                        input.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 300);
                });

                // Also handle viewport resize (keyboard open/close)
                if (window.visualViewport) {
                    window.visualViewport.addEventListener('resize', () => {
                        if (document.activeElement === input) {
                            setTimeout(() => {
                                input.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }, 100);
                        }
                    });
                }
            }
        })();

        // === TYPING TITLE ANIMATION ===
        (function() {
            const titles = [
                '货币换算',
                '貨幣換算',
                '両替',
                'Palitan',
                'Currency'
            ];
            const el = document.getElementById('titleText');
            const h1 = el.parentElement;
            let titleIdx = 0;

            el.textContent = titles[0];
            h1.style.opacity = '1';

            function cycleTitles() {
                setTimeout(() => {
                    // 2s fade out
                    h1.style.transition = 'opacity 2s ease';
                    h1.style.opacity = '0';
                    setTimeout(() => {
                        titleIdx = (titleIdx + 1) % titles.length;
                        el.textContent = titles[titleIdx];
                        // 1s fade in
                        h1.style.transition = 'opacity 1s ease';
                        h1.style.opacity = '1';
                        cycleTitles();
                    }, 2000);
                }, 3000);
            }
            cycleTitles();
        })();

        // === PARTICLES ===
        (function() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (8 + Math.random() * 12) + 's';
                p.style.animationDelay = (Math.random() * 10) + 's';
                p.style.width = p.style.height = (1 + Math.random() * 1.5) + 'px';
                if (Math.random() > 0.7) p.style.background = '#ff6d00';
                container.appendChild(p);
            }
        })();

        // === DATA LINE READOUT ===
        (function() {
            const el = document.getElementById('dataLine');
            setInterval(() => {
                const now = new Date();
                const ts = now.toTimeString().slice(0, 8);
                el.textContent = `SYS:ACTIVE // ${ts}`;
            }, 1000);
        })();

        // === INTERACTION EFFECTS ===
        function createRipple(container, x, y, size, isOrange) {
            const ripple = document.createElement('div');
            ripple.className = 'touch-ripple' + (isOrange ? ' orange' : '');
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (x - size / 2) + 'px';
            ripple.style.top = (y - size / 2) + 'px';
            container.appendChild(ripple);
            requestAnimationFrame(() => ripple.classList.add('fire'));
            setTimeout(() => ripple.remove(), 600);
        }

        function createShockwave(container, x, y, isOrange) {
            const ring = document.createElement('div');
            ring.className = 'numpad-shockwave' + (isOrange ? ' orange' : '');
            ring.style.width = ring.style.height = '40px';
            ring.style.left = (x - 20) + 'px';
            ring.style.top = (y - 20) + 'px';
            container.appendChild(ring);
            requestAnimationFrame(() => ring.classList.add('fire'));
            setTimeout(() => ring.remove(), 600);
        }

        function flashValue(input) {
            input.classList.remove('value-flash');
            void input.offsetWidth;
            input.classList.add('value-flash');
        }

        function createInputWave(input) {
            const row = input.closest('.currency-row');
            const rect = input.getBoundingClientRect();
            const rowRect = row.getBoundingClientRect();
            const wave = document.createElement('div');
            wave.className = 'input-wave';
            wave.style.top = (rect.top - rowRect.top) + 'px';
            wave.style.left = (rect.left - rowRect.left) + 'px';
            wave.style.width = rect.width + 'px';
            wave.style.height = rect.height + 'px';
            row.appendChild(wave);
            void wave.offsetWidth;
            wave.classList.add('fire');
            wave.addEventListener('animationend', () => wave.remove());
        }

        function sweepRow(row) {
            row.classList.remove('sweep');
            void row.offsetWidth;
            row.classList.add('sweep');
        }

        // === CORE LOGIC ===
        const currencies = ['TWD', 'USD', 'CAD', 'CNY', 'JPY', 'PHP', 'SGD'];
        const DEFAULT_CURRENCY_KEY = 'defaultCurrency';

        const staticRates = {
            TWD: 32.5,
            USD: 1,
            CAD: 1.36,
            CNY: 7.25,
            JPY: 149.5,
            PHP: 56.5,
            SGD: 1.34
        };

        let rates = { ...staticRates };
        let isLive = false;
        let activeField = null;

        function getDefaultCurrency() {
            return localStorage.getItem(DEFAULT_CURRENCY_KEY) || 'TWD';
        }

        function setDefaultCurrency(code) {
            localStorage.setItem(DEFAULT_CURRENCY_KEY, code);
            document.querySelectorAll('.currency-label').forEach(el => {
                el.classList.remove('is-default', 'default-flicker');
            });
            const row = document.getElementById(code).closest('.currency-row');
            const label = row.querySelector('.currency-label');
            label.classList.add('is-default');
            // Trigger flicker animation on the default star
            void label.offsetWidth;
            label.classList.add('default-flicker');
        }

        async function fetchRates() {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            try {
                const res = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await res.json();

                if (data.result === 'success') {
                    rates.USD = 1;
                    rates.TWD = data.rates.TWD;
                    rates.CAD = data.rates.CAD;
                    rates.CNY = data.rates.CNY;
                    rates.JPY = data.rates.JPY;
                    rates.SGD = data.rates.SGD;
                    isLive = true;

                    statusDot.className = 'status-dot live';
                    const updated = new Date(data.time_last_update_utc).toLocaleDateString();
                    statusText.textContent = `LIVE // ${updated}`;

                    if (activeField) {
                        convert(activeField);
                    }
                } else {
                    throw new Error('API returned error');
                }
            } catch {
                rates = { ...staticRates };
                isLive = false;
                statusDot.className = 'status-dot static';
                statusText.textContent = 'OFFLINE // STATIC RATES';
            }
        }

        function addCommas(numStr) {
            const parts = numStr.split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            return parts.join('.');
        }

        function formatInput(input) {
            const raw = input.value.replace(/,/g, '');
            if (raw === '' || raw === '.' || raw === '-') return;
            const match = raw.match(/^(\d*)(\.\d*)?$/);
            if (!match) return;
            const formatted = addCommas(match[1] || '0') + (match[2] || '');
            const cursorFromEnd = input.value.length - input.selectionStart;
            input.value = formatted;
            const newCursor = Math.max(0, formatted.length - cursorFromEnd);
            input.setSelectionRange(newCursor, newCursor);
        }

        function convert(sourceCurrency) {
            const sourceInput = document.getElementById(sourceCurrency);
            const rawValue = sourceInput.value.replace(/,/g, '');
            const value = parseFloat(rawValue);

            if (isNaN(value) || rawValue.trim() === '') {
                currencies.forEach(c => {
                    if (c !== sourceCurrency) {
                        document.getElementById(c).value = '';
                    }
                });
                return;
            }

            formatInput(sourceInput);

            const valueInUSD = value / rates[sourceCurrency];

            currencies.forEach((c, i) => {
                if (c !== sourceCurrency) {
                    const el = document.getElementById(c);
                    const converted = valueInUSD * rates[c];
                    const decimals = (c === 'JPY' || c === 'TWD') ? 0 : 2;
                    const newVal = addCommas(converted.toFixed(decimals));
                    if (el.value !== newVal) {
                        el.value = newVal;
                        setTimeout(() => flashValue(el), i * 40);
                    }
                }
            });
        }

        // Set up input listeners and tap-to-set-default
        currencies.forEach(currency => {
            const input = document.getElementById(currency);
            const row = input.closest('.currency-row');
            const label = row.querySelector('.currency-label');

            // Add beating cursor element
            const cursor = document.createElement('span');
            cursor.className = 'cursor-blink';
            cursor.style.display = 'none';
            row.appendChild(cursor);

            input.addEventListener('input', () => {
                activeField = currency;
                convert(currency);
            });

            input.addEventListener('focus', () => {
                // Skip full reset if already the active row
                if (activeField === currency && row.classList.contains('active-row')) return;
                activeField = currency;
                // Remove active-row and breathing glow from all rows
                document.querySelectorAll('.currency-row').forEach(r => r.classList.remove('active-row', 'focus-flicker'));
                document.querySelectorAll('.currency-input').forEach(el => el.classList.remove('active-glow'));
                // Activate this row
                row.classList.add('active-row');
                input.classList.add('active-glow');
                // Show cursor only on focused row
                document.querySelectorAll('.cursor-blink').forEach(c => c.style.display = 'none');
                cursor.style.display = 'block';
                // Flicker effect
                void row.offsetWidth;
                row.classList.add('focus-flicker');
                // Sweep effect on row
                sweepRow(row);
            });

            label.addEventListener('click', () => {
                setDefaultCurrency(currency);
            });
        });

        // Mark default and select it on load
        const defaultCurrency = getDefaultCurrency();
        setDefaultCurrency(defaultCurrency);
        activeField = defaultCurrency;
        document.getElementById(defaultCurrency).focus();

        // Numpad logic with interaction effects
        document.querySelectorAll('.numpad-btn').forEach(btn => {
            // Prevent numpad from stealing focus (desktop)
            btn.addEventListener('mousedown', (e) => e.preventDefault());

            btn.addEventListener('click', (e) => {
                e.preventDefault();
                if (!activeField) activeField = getDefaultCurrency();
                const input = document.getElementById(activeField);
                const raw = input.value.replace(/,/g, '');
                const key = btn.dataset.key;
                const isOrange = key === 'C' || key === 'del';

                // Button bounce animation
                btn.classList.remove('btn-pop', 'btn-pop-orange');
                void btn.offsetWidth;
                btn.classList.add(isOrange ? 'btn-pop-orange' : 'btn-pop');

                // Ripple from touch point
                const rect = btn.getBoundingClientRect();
                const x = e.clientX ? e.clientX - rect.left : rect.width / 2;
                const y = e.clientY ? e.clientY - rect.top : rect.height / 2;
                createRipple(btn, x, y, 120, isOrange);
                createShockwave(btn, x, y, isOrange);

                if (key === 'C') {
                    input.value = '';
                    convert(activeField);
                } else if (key === 'del') {
                    input.value = addCommas(raw.slice(0, -1));
                    convert(activeField);
                } else if (key === '.') {
                    if (!raw.includes('.')) {
                        input.value = addCommas(raw || '0') + '.';
                        convert(activeField);
                    }
                } else {
                    input.value = addCommas(raw + key);
                    convert(activeField);
                }

                // Flash the active input
                flashValue(input);

                // Wave ring expanding from input
                createInputWave(input);

                // Pulse the input field border/glow
                input.classList.remove('active-glow', 'key-pulse');
                void input.offsetWidth;
                input.classList.add('key-pulse');
                input.addEventListener('animationend', () => {
                    input.classList.remove('key-pulse');
                    input.classList.add('active-glow');
                }, { once: true });

                // Restore focus to active input (touch devices)
                input.focus();
            });
        });

        fetchRates();
    </script>
</body>
</html>
