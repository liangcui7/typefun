<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f2027">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Currency">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23203a43'/%3E%3Cstop offset='100%25' stop-color='%232c5364'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='96' fill='url(%23bg)'/%3E%3Ccircle cx='200' cy='220' r='90' fill='none' stroke='%234fc3f7' stroke-width='24'/%3E%3Ctext x='200' y='245' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='96' fill='%234fc3f7'%3E%24%3C/text%3E%3Ccircle cx='312' cy='292' r='90' fill='none' stroke='%2381d4fa' stroke-width='24'/%3E%3Ctext x='312' y='318' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='80' fill='%2381d4fa'%3E%C2%A5%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23203a43'/%3E%3Cstop offset='100%25' stop-color='%232c5364'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='96' fill='url(%23bg)'/%3E%3Ccircle cx='200' cy='220' r='90' fill='none' stroke='%234fc3f7' stroke-width='24'/%3E%3Ctext x='200' y='245' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='96' fill='%234fc3f7'%3E%24%3C/text%3E%3Ccircle cx='312' cy='292' r='90' fill='none' stroke='%2381d4fa' stroke-width='24'/%3E%3Ctext x='312' y='318' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='80' fill='%2381d4fa'%3E%C2%A5%3C/text%3E%3C/svg%3E">
    <title>Currency Converter</title>
    <script>
        // Inline web app manifest for Android home screen
        const manifest = {
            name: "Currency Converter",
            short_name: "Currency",
            start_url: "converter.html",
            display: "standalone",
            background_color: "#0f2027",
            theme_color: "#0f2027",
            icons: [{
                src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23203a43'/%3E%3Cstop offset='100%25' stop-color='%232c5364'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='96' fill='url(%23bg)'/%3E%3Ccircle cx='200' cy='220' r='90' fill='none' stroke='%234fc3f7' stroke-width='24'/%3E%3Ctext x='200' y='245' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='96' fill='%234fc3f7'%3E%24%3C/text%3E%3Ccircle cx='312' cy='292' r='90' fill='none' stroke='%2381d4fa' stroke-width='24'/%3E%3Ctext x='312' y='318' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='80' fill='%2381d4fa'%3E%C2%A5%3C/text%3E%3C/svg%3E",
                sizes: "512x512",
                type: "image/svg+xml",
                purpose: "any maskable"
            }]
        };
        const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = URL.createObjectURL(blob);
        document.head.appendChild(link);
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            color: #e0e0e0;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            margin: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #fff;
        }

        .subtitle {
            text-align: center;
            font-size: 0.8rem;
            color: #8899aa;
            margin-bottom: 16px;
        }

        .currency-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .currency-label {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 90px;
            cursor: pointer;
            position: relative;
        }

        .currency-label .default-star {
            position: absolute;
            top: -4px;
            right: -4px;
            font-size: 0.55rem;
            color: #4fc3f7;
            display: none;
        }

        .currency-label.is-default .default-star {
            display: block;
        }

        .flag {
            font-size: 1.2rem;
            line-height: 1;
        }

        .code {
            font-weight: 600;
            font-size: 0.85rem;
            color: #ccd6e0;
        }

        .currency-name {
            font-size: 0.65rem;
            color: #667788;
        }

        .currency-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 1rem;
            color: #fff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            text-align: right;
            font-family: 'SF Mono', 'Fira Code', monospace;
        }

        .currency-input:focus {
            border-color: #4fc3f7;
            box-shadow: 0 0 0 3px rgba(79, 195, 247, 0.15);
        }

        .currency-input::placeholder {
            color: #556677;
        }

        .status {
            text-align: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }

        .status-dot.live {
            background: #4caf50;
            box-shadow: 0 0 6px #4caf50;
        }

        .status-dot.static {
            background: #ff9800;
            box-shadow: 0 0 6px #ff9800;
        }

        .status-text {
            font-size: 0.75rem;
            color: #667788;
        }

        .refresh-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #8899aa;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            margin-left: 10px;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            border-color: #4fc3f7;
            color: #4fc3f7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Currency Converter</h1>
        <p class="subtitle">Type in any field to convert</p>

        <div class="currency-row">
            <div class="currency-label" data-currency-label>
                <span class="default-star">&#9733;</span>
                <span class="flag">🇹🇼</span>
                <div>
                    <div class="code">TWD</div>
                    <div class="currency-name">NT Dollar</div>
                </div>
            </div>
            <input type="text" inputmode="decimal" class="currency-input" id="TWD" placeholder="0.00">
        </div>

        <div class="currency-row">
            <div class="currency-label" data-currency-label>
                <span class="default-star">&#9733;</span>
                <span class="flag">🇺🇸</span>
                <div>
                    <div class="code">USD</div>
                    <div class="currency-name">US Dollar</div>
                </div>
            </div>
            <input type="text" inputmode="decimal" class="currency-input" id="USD" placeholder="0.00">
        </div>

        <div class="currency-row">
            <div class="currency-label" data-currency-label>
                <span class="default-star">&#9733;</span>
                <span class="flag">🇨🇦</span>
                <div>
                    <div class="code">CAD</div>
                    <div class="currency-name">Canadian Dollar</div>
                </div>
            </div>
            <input type="text" inputmode="decimal" class="currency-input" id="CAD" placeholder="0.00">
        </div>

        <div class="currency-row">
            <div class="currency-label" data-currency-label>
                <span class="default-star">&#9733;</span>
                <span class="flag">🇨🇳</span>
                <div>
                    <div class="code">CNY</div>
                    <div class="currency-name">Chinese Yuan</div>
                </div>
            </div>
            <input type="text" inputmode="decimal" class="currency-input" id="CNY" placeholder="0.00">
        </div>

        <div class="currency-row">
            <div class="currency-label" data-currency-label>
                <span class="default-star">&#9733;</span>
                <span class="flag">🇯🇵</span>
                <div>
                    <div class="code">JPY</div>
                    <div class="currency-name">Japanese Yen</div>
                </div>
            </div>
            <input type="text" inputmode="decimal" class="currency-input" id="JPY" placeholder="0.00">
        </div>

        <div class="currency-row">
            <div class="currency-label" data-currency-label>
                <span class="default-star">&#9733;</span>
                <span class="flag">🇸🇬</span>
                <div>
                    <div class="code">SGD</div>
                    <div class="currency-name">Singapore Dollar</div>
                </div>
            </div>
            <input type="text" inputmode="decimal" class="currency-input" id="SGD" placeholder="0.00">
        </div>

        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-text" id="statusText">Loading rates...</span>
            <button class="refresh-btn" onclick="fetchRates()">Refresh</button>
        </div>
    </div>

    <script>
        const currencies = ['TWD', 'USD', 'CAD', 'CNY', 'JPY', 'SGD'];
        const DEFAULT_CURRENCY_KEY = 'defaultCurrency';

        // Static fallback rates (per 1 USD)
        const staticRates = {
            TWD: 32.5,
            USD: 1,
            CAD: 1.36,
            CNY: 7.25,
            JPY: 149.5,
            SGD: 1.34
        };

        let rates = { ...staticRates };
        let isLive = false;
        let activeField = null;

        function getDefaultCurrency() {
            return localStorage.getItem(DEFAULT_CURRENCY_KEY) || 'TWD';
        }

        function setDefaultCurrency(code) {
            localStorage.setItem(DEFAULT_CURRENCY_KEY, code);
            document.querySelectorAll('.currency-label').forEach(el => {
                el.classList.remove('is-default');
            });
            const row = document.getElementById(code).closest('.currency-row');
            row.querySelector('.currency-label').classList.add('is-default');
        }

        async function fetchRates() {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            try {
                const res = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await res.json();

                if (data.result === 'success') {
                    rates.USD = 1;
                    rates.TWD = data.rates.TWD;
                    rates.CAD = data.rates.CAD;
                    rates.CNY = data.rates.CNY;
                    rates.JPY = data.rates.JPY;
                    rates.SGD = data.rates.SGD;
                    isLive = true;

                    statusDot.className = 'status-dot live';
                    const updated = new Date(data.time_last_update_utc).toLocaleDateString();
                    statusText.textContent = `Live rates \u00b7 Updated ${updated}`;

                    // Re-convert active field if there's a value
                    if (activeField) {
                        convert(activeField);
                    }
                } else {
                    throw new Error('API returned error');
                }
            } catch {
                rates = { ...staticRates };
                isLive = false;
                statusDot.className = 'status-dot static';
                statusText.textContent = 'Using static rates (API unavailable)';
            }
        }

        function convert(sourceCurrency) {
            const sourceInput = document.getElementById(sourceCurrency);
            const rawValue = sourceInput.value.replace(/,/g, '');
            const value = parseFloat(rawValue);

            if (isNaN(value) || rawValue.trim() === '') {
                currencies.forEach(c => {
                    if (c !== sourceCurrency) {
                        document.getElementById(c).value = '';
                    }
                });
                return;
            }

            // Convert source to USD first, then to each target
            const valueInUSD = value / rates[sourceCurrency];

            currencies.forEach(c => {
                if (c !== sourceCurrency) {
                    const converted = valueInUSD * rates[c];
                    // JPY typically shown without decimals, others with 2
                    const decimals = (c === 'JPY' || c === 'TWD') ? 0 : 2;
                    document.getElementById(c).value = converted.toFixed(decimals);
                }
            });
        }

        // Set up input listeners and tap-to-set-default
        currencies.forEach(currency => {
            const input = document.getElementById(currency);
            const label = input.closest('.currency-row').querySelector('.currency-label');

            input.addEventListener('input', () => {
                activeField = currency;
                convert(currency);
            });

            input.addEventListener('focus', () => {
                activeField = currency;
            });

            // Tap label to set as default
            label.addEventListener('click', () => {
                setDefaultCurrency(currency);
            });
        });

        // Mark default and auto-focus on load
        const defaultCurrency = getDefaultCurrency();
        setDefaultCurrency(defaultCurrency);
        setTimeout(() => {
            document.getElementById(defaultCurrency).focus();
        }, 300);

        // Fetch live rates on load
        fetchRates();
    </script>
</body>
</html>
